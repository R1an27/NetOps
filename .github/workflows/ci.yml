name: NetOps Continuous Integration (CI)

on:
  # Kích hoạt ngay khi có commit được push lên main hoặc develop.
  push:
    branches: [ "main", "develop" ]
  # Kích hoạt khi có PR được tạo hoặc cập nhật trỏ tới main main or develop
  # Nếu CI thất bại, PR sẽ bị chặn merge.
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Job này chạy trên máy ảo windows-latest, kiểm tra tính toàn vẹn của 
  #toàn bộ Solution (NetOps.sln bao gồm Master, Agent, Contracts và Test project).
  build-and-test:
    name: Build & Test (Windows Runner)
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      # Kéo mã nguồn từ repository về máy ảo của GitHub.
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      # Cài đặt bộ SDK .NET 10 trên runner để thực thi các lệnh dotnet.
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies
      # Tải về toàn bộ các thư viện NuGet dependencies.
      run: dotnet restore NetOps.slnx

    - name: Build Solution
      # Biên dịch toàn bộ solution ở chế độ tối ưu hóa Release.
      # Cờ --no-restore giúp tiết kiệm thời gian vì đã tải thư viện ở bước trước, 
      # tránh việc .NET phải quét và restore lại lần nữa.
      run: dotnet build NetOps.slnx --configuration Release --no-restore

    - name: Execute Automated Tests
      # Chạy toàn bộ các bài kiểm thử tự động (Unit Tests / Integration Tests).
      # Cờ --no-build tận dụng lại kết quả build ở bước ngay trước, 
      # giúp test chạy lập tức mà không tốn công biên dịch lại.
      # --verbosity normal: In chi tiết tên từng bài test để dễ kiểm tra nếu có bài nào bị fail.
      run: dotnet test NetOps.slnx --configuration Release --no-build --verbosity normal

  test-linux-agent:
    name: Verify Linux Agent Compatibility (Ubuntu Runner)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Shared.Contracts
      # Biên dịch project chứa giao thức mạng, FrameCodec, models.
      run: dotnet build src/Shared.Contracts/Shared.Contracts.csproj --configuration Release

    - name: Build Agent.Worker
      # Biên dịch project chứa chính là background worker chạy trên máy ảo test.
      run: dotnet build src/Agent.Worker/Agent.Worker.csproj --configuration Release